<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Fresh Oranges</title>
    <link href="../css/styles.css" rel="stylesheet" />
  </head>

  <body class="bg-slate-100 p-8 text-slate-700">
    <section
      class="flex flex-col gap-4 rounded-xl bg-white p-6 sm:flex-row sm:gap-0 sm:p-0"
    >
      <img
        alt=""
        class="rounded-lg object-cover sm:max-w-70 sm:flex-1 sm:rounded-l-lg sm:rounded-r-none"
        src="images/orange-orchard.png"
      />
      <div class="sm:p-6">
        <h1 class="text-2xl font-semibold text-green-800 sm:p-6">
          Fresh Oranges, Naturally
        </h1>
        <p class="mt-2 font-light">
          Fresh oranges ripen under the sun, ready to be picked and enjoyed.
          This orchard reflects the simplicity of nature, reminding us of the
          joy that comes with fresh, wholesome produce grown with care.
        </p>
      </div>
    </section>
  </body>
</html>
